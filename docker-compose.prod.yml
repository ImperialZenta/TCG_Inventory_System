# PRODUCTION stack for real store operations (ADR-011, PL-009).
#
# - Project name is pinned to "tcg-prod" so this stack can never collide with
#   the dev stack in docker-compose.yml (default project).
# - The database volume is EXTERNAL: `docker compose down -v` will NOT delete it.
#   Create it once with:  docker volume create tcg_prod_pgdata
# - Only (re)build this stack from a tagged release (git tag store-vN).
# - Runbook: docs/operations/STORE-OPERATIONS.md
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down          # data survives
name: tcg-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg_inventory
    volumes:
      - tcg_prod_pgdata:/var/lib/postgresql/data
      # Host-visible folder for pg_dump archives (scripts/backup-store.ps1).
      - ./backups/store:/backups
    ports:
      # 5433 on the host so it never collides with the dev Postgres on 5432.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.prod
        required: false
    environment:
      DATABASE_URL: postgresql://tcg:tcg@db:5432/tcg_inventory
      # Fail loudly instead of falling back to `prisma db push --accept-data-loss`.
      MIGRATE_STRICT: "true"
      STALE_BLOCK_DAYS: "90"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

volumes:
  tcg_prod_pgdata:
    external: true
