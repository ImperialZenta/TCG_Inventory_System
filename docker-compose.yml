services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcg
      POSTGRES_PASSWORD: tcg
      POSTGRES_DB: tcg_inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg -d tcg_inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      # Dev app lives on 3010; the production store owns 3000 (ADR-011).
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://tcg:tcg@db:5432/tcg_inventory
      STALE_BLOCK_DAYS: "90"
      MANAPOOL_EMAIL: ${MANAPOOL_EMAIL:-}
      MANAPOOL_API_TOKEN: ${MANAPOOL_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

  test:
    build:
      context: .
      target: test
    profiles:
      - test
    environment:
      DATABASE_URL: postgresql://tcg:tcg@db:5432/tcg_inventory_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
